services:
  - type: web
    name: moneymani
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/session
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moneymani-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: moneymani-db
    plan: free
    region: singapore
    databaseName: moneymani
    user: moneymani_user
